# ==============================================================================
#  Environnement de DEV local. Lance les 3 process (backend, streamlit,
#  portail — le portail se lance à part via `cd frontend-portail && npm run
#  dev`, pas encore intégré ici car il n'est pas requis pour la boucle
#  backend/Celery) + Redis + Celery worker/beat + Flower, avec un Postgres
#  local optionnel (profil `local-db`, sinon `backend/.env` pointe sur Neon).
#
#  Usage :
#    docker compose up                     # backend + streamlit + redis + celery + flower
#    docker compose --profile local-db up   # + un Postgres local
#
#  backend/.env et src/.env sont lus tels quels (env_file) ; REDIS_URL est
#  systématiquement surchargé ici en `redis://redis:6379/0` (le `.env` par
#  défaut vise `localhost`, valable seulement hors conteneur).
# ==============================================================================
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ia_conseil
      POSTGRES_PASSWORD: ia_conseil
      POSTGRES_DB: ia_conseil
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
    command: celery -A backend.workers.celery_app worker --loglevel=info
    depends_on:
      - redis

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
    command: celery -A backend.workers.celery_app beat --loglevel=info
    depends_on:
      - redis

  flower:
    image: mher/flower:2.0
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis

  streamlit:
    build:
      context: .
      dockerfile: src/Dockerfile
    env_file: src/.env
    volumes:
      - ./src:/app
    ports:
      - "8501:8501"
    depends_on:
      - redis

volumes:
  pg_data:
